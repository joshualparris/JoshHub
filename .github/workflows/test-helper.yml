name: Conformance test diagnostic

on:
  push:
    branches:
      - agent/conformance-format

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture test output
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          echo "TEST_EXIT_STATUS=$status" >> test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-output.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture conformance test output"
            git push origin HEAD:agent/conformance-format
          fi
