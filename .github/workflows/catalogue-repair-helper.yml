name: Catalogue repair helper

on:
  push:
    branches:
      - audit/conformance-catalogue-assets-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/conformance-catalogue-assets-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/catalogue-asset-repair.cjs
      - run: npm run format
      - run: npm run validate:apps
      - run: npm run check:assets
      - name: Commit repaired catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/apps.ts public/games/random-play/links.json
          git diff --cached --quiet || git commit -m "fix: make catalogue asset claims truthful"
          git push origin HEAD:audit/conformance-catalogue-assets-20260909
