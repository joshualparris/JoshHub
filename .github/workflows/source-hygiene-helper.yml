name: Source hygiene helper

on:
  push:
    branches:
      - audit/conformance-18-final-20260909

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/conformance-18-final-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove proven dead source and clean names/comments
        shell: bash
        run: |
          rm -f \
            src/components/app-detail.tsx \
            src/components/apps-directory.tsx \
            src/components/recent-list.tsx \
            src/components/ui/alert.tsx \
            src/features/apps/contextPills.tsx \
            src/lib/react/ClientOnly.tsx \
            src/lib/react/useHydrated.ts \
            src/lib/utils/ssr.ts \
            src/lib/repos/dexie/platform/seed.ts \
            src/data/gamesShowcase.ts \
            src/lib/appUrlResolver.ts

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'src/app/dashboard/page.tsx': [
              ('  const s = new Date(start).getTime();\n  const e = new Date(end).getTime();\n  if (Number.isNaN(s) || Number.isNaN(e)) return null;\n  const diff = (e - s) / 60000;\n',
               '  const startMs = new Date(start).getTime();\n  const endMs = new Date(end).getTime();\n  if (Number.isNaN(startMs) || Number.isNaN(endMs)) return null;\n  const diff = (endMs - startMs) / 60000;\n'),
            ],
            'src/app/games/page.tsx': [
              ('            let s = 0;\n', '            let score = 0;\n'),
              (' s += 100;', ' score += 100;'),
              (' s += 80;', ' score += 80;'),
              (' s += 50;', ' score += 50;'),
              (' s += 20;', ' score += 20;'),
              (' s -= 10;', ' score -= 10;'),
              ('              s += Math.min(', '              score += Math.min('),
              ('            return s;\n', '            return score;\n'),
            ],
            'src/app/health/import/page.tsx': [
              ('  const h =\n', '  const haversineTerm =\n'),
              ('  const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));\n  return R * c;\n',
               '  const angularDistance =\n    2 * Math.atan2(Math.sqrt(haversineTerm), Math.sqrt(1 - haversineTerm));\n  return R * angularDistance;\n'),
              ('  const val = sportAttr.toLowerCase();\n  if (val.includes("run"))', '  const normalizedSport = sportAttr.toLowerCase();\n  if (normalizedSport.includes("run"))'),
              ('  if (val.includes("walk"))', '  if (normalizedSport.includes("walk"))'),
              ('  if (val.includes("ride") || val.includes("bike") || val.includes("cycle"))',
               '  if (\n    normalizedSport.includes("ride") ||\n    normalizedSport.includes("bike") ||\n    normalizedSport.includes("cycle")\n  )'),
              ('            const val = point.value?.[0];\n            const fpVal = typeof val?.fpVal === "number" ? val.fpVal : null;\n            const intVal = typeof val?.intVal === "number" ? val.intVal : null;\n',
               '            const pointValue = point.value?.[0];\n            const fpVal = typeof pointValue?.fpVal === "number" ? pointValue.fpVal : null;\n            const intVal = typeof pointValue?.intVal === "number" ? pointValue.intVal : null;\n'),
            ],
            'src/app/health/sleep/page.tsx': [
              ('  const s = new Date(start).getTime();\n  const e = new Date(end).getTime();\n  if (Number.isNaN(s) || Number.isNaN(e)) return null;\n  const diff = (e - s) / 60000;\n',
               '  const startMs = new Date(start).getTime();\n  const endMs = new Date(end).getTime();\n  if (Number.isNaN(startMs) || Number.isNaN(endMs)) return null;\n  const diff = (endMs - startMs) / 60000;\n'),
            ],
            'src/app/notes/page.tsx': [
              ('    const q = search.toLowerCase();\n', '    const normalizedSearch = search.toLowerCase();\n'),
              ('includes(q)', 'includes(normalizedSearch)'),
            ],
            'src/components/global-search.tsx': [
              ('    const q = query.toLowerCase();\n', '    const normalizedQuery = query.toLowerCase();\n'),
              ('includes(q)', 'includes(normalizedQuery)'),
            ],
            'src/components/learn/StudyPromptButton.tsx': [
              ('    const p = makePrompt();\n', '    const prompt = makePrompt();\n'),
              ('writeText(p)', 'writeText(prompt)'),
            ],
            'src/lib/analytics/lifestyle.ts': [
              ('        const t = new Date(ev.timestampIso).getTime();\n        return t >= end && t <= windowEnd;\n',
               '        const eventTime = new Date(ev.timestampIso).getTime();\n        return eventTime >= end && eventTime <= windowEnd;\n'),
            ],
            'src/lib/db/id.ts': [
              ('  return "xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {\n    const r = (Math.random() * 16) | 0;\n    const v = c === "x" ? r : (r & 0x3) | 0x8;\n    return v.toString(16);\n  });\n',
               '  return "xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (placeholder) => {\n    const randomNibble = (Math.random() * 16) | 0;\n    const uuidNibble = placeholder === "x" ? randomNibble : (randomNibble & 0x3) | 0x8;\n    return uuidNibble.toString(16);\n  });\n'),
            ],
            'src/lib/parsing/comma-list.ts': [
              ('    const item = rawItem.trim();\n    if (!item)', '    const trimmedValue = rawItem.trim();\n    if (!trimmedValue'),
              ('seen.has(item)', 'seen.has(trimmedValue)'),
              ('seen.add(item)', 'seen.add(trimmedValue)'),
              ('result.push(item)', 'result.push(trimmedValue)'),
            ],
            'src/lib/repos/dexie/learnRepoDexie.ts': [
              ('  const t: LearnTopic = {', '  const topic: LearnTopic = {'),
              ('  await db.learnTopics.put(t);\n  return t;', '  await db.learnTopics.put(topic);\n  return topic;'),
              ('  const q = query.toLowerCase();\n', '  const normalizedQuery = query.toLowerCase();\n'),
              ('.includes(q)', '.includes(normalizedQuery)'),
              ('  const r: LearnResource = {', '  const resource: LearnResource = {'),
              ('  await db.learnResources.put(r);\n  return r;', '  await db.learnResources.put(resource);\n  return resource;'),
              ('  const n: LearnNote = {', '  const note: LearnNote = {'),
              ('  await db.learnNotes.put(n);\n  return n;', '  await db.learnNotes.put(note);\n  return note;'),
              ('  const s: LearnSession = {', '  const session: LearnSession = {'),
              ('  await db.learnSessions.put(s);\n  return s;', '  await db.learnSessions.put(session);\n  return session;'),
            ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for before, after in pairs:
                  if before not in text:
                      raise RuntimeError(f'Expected fragment missing in {filename}: {before[:80]!r}')
                  text = text.replace(before, after, 1)
              path.write_text(text)

          # ImportTopicsModal uses a loop index legitimately; only rename the topic binding.
          path = Path('src/components/learn/ImportTopicsModal.tsx')
          text = path.read_text()
          if '        const t: LearnTopic = {' not in text:
              raise RuntimeError('ImportTopicsModal topic binding not found')
          text = text.replace('        const t: LearnTopic = {', '        const topic: LearnTopic = {', 1)
          text = text.replace('        await createTopic(t);', '        await createTopic(topic);', 1)
          path.write_text(text)

          # Remove comments that only repeat the object grouping; the object keys already say this.
          path = Path('src/features/platform/index.ts')
          text = path.read_text()
          for comment in ['  // MoveOps\n', '  // Decision Cards\n', '  // Opportunities\n', '  // Weekly Reviews\n']:
              text = text.replace(comment, '')
          path.write_text(text)

          path = Path('src/lib/repos/dexie/platform/weeklyReviewsRepoDexie.ts')
          text = path.read_text().replace('    // Sort by weekStart descending (newest weeks first)\n', '')
          path.write_text(text)
          PY
      - name: Make dead-code analysis deterministic
        run: |
          npm uninstall --save-dev eslint-config-next baseline-browser-mapping
          npm install --save-dev knip @eslint/js typescript-eslint eslint-plugin-react-hooks
          cat > knip.json <<'JSON'
          {
            "entry": [
              "src/app/**/*.{ts,tsx}",
              "src/**/*.test.{ts,tsx}"
            ],
            "project": [
              "src/**/*.{ts,tsx}",
              "scripts/**/*.{js,cjs,mjs,ts}"
            ],
            "ignore": ["public/**"]
          }
          JSON
      - run: npm run format
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate:apps
      - run: npm run check:mutation
      - run: npm run check:conflict-markers
      - run: npm run check:assets
      - run: npm run check:duplicate-modules
      - name: Report remaining dead code without blocking this cleanup checkpoint
        run: npx knip --reporter compact || true
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor: remove dead source and tighten code hygiene"
          git push origin HEAD:audit/conformance-18-final-20260909
