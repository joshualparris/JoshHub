name: Format preview

on:
  push:
    branches: [chatgpt/fix-antigravity-corrections]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/lib/parsing/csv.ts src/lib/parsing/csv.test.ts
          git diff -- src/lib/parsing/csv.ts src/lib/parsing/csv.test.ts
