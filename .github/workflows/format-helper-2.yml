name: Conformance format helper 2

on:
  push:
    branches:
      - agent/conformance-format-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src vitest.config.ts package.json package-lock.json eslint.config.mjs next.config.ts tsconfig.json postcss.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository formatter"
            git push origin HEAD:agent/conformance-format-2
          fi
