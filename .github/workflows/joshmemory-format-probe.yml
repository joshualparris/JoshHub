name: JoshMemory format probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/app/joshmemory/page.tsx src/app/api/joshmemory-status/route.ts
          git diff -- src/app/joshmemory/page.tsx src/app/api/joshmemory-status/route.ts
