name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate app catalogue
        run: npm run validate:apps

      # scripts/check-assets.js is intentionally not enforced here yet.
      # The code audit records existing broken asset/catalogue links and CFG-06;
      # add this check once those known failures are resolved rather than making
      # baseline CI permanently red for a pre-existing condition.
