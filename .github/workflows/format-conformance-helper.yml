name: Format conformance helper

on:
  push:
    branches:
      - audit/format-conformance-20260909b

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/format-conformance-20260909b
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src eslint.config.mjs package.json tsconfig.json
          git diff --cached --quiet || git commit -m "style: apply repository formatter"
          git push origin HEAD:audit/format-conformance-20260909b
