name: One-off Prettier cleanup

on:
  push:
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format affected pages
        run: >-
          npx prettier --write
          src/app/avance-whs/page.tsx
          src/app/engineering-principles/page.tsx
          src/app/podcast-rollout/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/avance-whs/page.tsx src/app/engineering-principles/page.tsx src/app/podcast-rollout/page.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format new JoshHub pages"
            git push origin HEAD:main
          fi
