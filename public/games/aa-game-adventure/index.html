<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Game Adventure</title>

  <script type="module" crossorigin src="./assets/index-GwEn_Nhp.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DNtx8YB6.css">
</head>

<body>
  <div id="game-help" role="group" aria-label="Game instructions" style="font:16px/1.45 system-ui,sans-serif;color:#f3f6fb;background:#172638;padding:12px 16px;max-width:900px;margin:8px auto;border-radius:8px">
    <strong>How to play:</strong> Explore using the arrow keys and collect the letters.
    <button type="button" id="focus-game" style="margin-left:12px;padding:8px 12px;cursor:pointer">Focus game controls</button>
    <span id="focus-status" role="status" style="margin-left:8px"></span>
  </div>
  <canvas id="game-canvas" tabindex="0" aria-label="AA Game Adventure game canvas" aria-describedby="game-help"></canvas>
  <script>
    const canvas = document.getElementById('game-canvas');
    const status = document.getElementById('focus-status');
    function focusGame() {
      canvas.focus();
      status.textContent = document.activeElement === canvas ? 'Game focused — use arrow keys.' : 'Click the game area, then use arrow keys.';
    }
    document.getElementById('focus-game').addEventListener('click', focusGame);
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
  <div id="error-overlay" class="error-overlay hidden"></div>

</body>

</html>
